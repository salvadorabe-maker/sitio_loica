<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Proyectos</title>

    <style>
        body {
            margin: 0;
            background-color: #FBF9EF;
            font-family: Helvetica, Arial, sans-serif;
        }

        /* HEADER */
        .header {
            padding: 25px;
            border-bottom: 1px solid #d8d8d8;
        }

        .titulo {
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #444;
        }

        /* GALERIA (ESCRITORIO) */
        .galeria-proyecto {
            column-count: 2;
            column-gap: 14px;
            padding: 25px;
        }

        .galeria-proyecto img {
            width: 100%;
            margin-bottom: 14px;
            display: block;
        }

        /* ==========================================
           RESPONSIVE MÓVIL (ESTÁNDAR LIMPIO)
           ========================================== */
        @media screen and (max-width: 768px) {
            html, body {
                overflow-x: hidden !important;
                overflow-y: auto !important;
                height: auto !important;
                width: 100% !important;
            }

            /* Evita que el título largo choque con el botón flotante */
            .header {
                padding: 20px 90px 20px 15px !important;
                box-sizing: border-box !important;
            }

            /* Botón volver fijo al hacer scroll */
            .btn-volver {
                position: fixed !important;
                top: 16px !important;
                right: 15px !important;
                z-index: 3000 !important;
                background-color: #FBF9EF !important;
                padding: 4px 6px !important;
                border-radius: 3px !important;
            }

            /* Fuerza una sola columna vertical */
            .galeria-proyecto {
                column-count: 1 !important; 
                column-gap: 0 !important;
                padding: 15px 0px !important; /* Fotos de borde a borde del celular */
                display: block !important;
                width: 100% !important;
            }

            /* Imágenes adaptadas al ancho real sin deformarse */
            .galeria-proyecto img {
                width: 100% !important;
                max-width: 100% !important;
                height: auto !important;
                margin-bottom: 12px !important;
                display: block !important;
            }

            /* Ajuste del footer independiente sin alterar su texto */
            footer {
                display: block !important;
                width: 100% !important;
                padding: 40px 15px 20px 15px !important;
                box-sizing: border-box !important;
            }
        }

        /* BOTÓN VOLVER */
        .btn-volver {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 10px;
            font-weight: 700;
            text-decoration: none;
            color: #000000;
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 1000;
        }

       /* ==========================================
           RESPONSIVE MÓVIL (ESTÁNDAR LIMPIO)
           ========================================== */
        @media screen and (max-width: 768px) {
            html, body {
                overflow-x: hidden !important;
                overflow-y: auto !important;
                height: auto !important;
                width: 100% !important;
            }

            /* Contenedor del encabezado */
            .header {
                padding: 20px 15px !important;
                box-sizing: border-box !important;
                position: relative !important;
            }

            /* RESTRICCIÓN PARA EL TÍTULO: EVITA QUE CHOQUE CON VOLVER */
            .titulo {
                max-width: 75% !important;       /* Ocupa máximo el 75% del ancho del celular */
                line-height: 1.4 !important;      /* Le da aire entre líneas si se divide en dos */
                font-size: 11px !important;       /* Achica un pelo la letra para que calce mejor */
                display: block !important;
            }

            /* Botón volver fijo al hacer scroll */
            .btn-volver {
                position: fixed !important;
                top: 16px !important;
                right: 15px !important;
                z-index: 3000 !important;
                background-color: #FBF9EF !important;
                padding: 4px 6px !important;
                border-radius: 3px !important;
            }

            /* Fuerza una sola columna vertical */
            .galeria-proyecto {
                column-count: 1 !important; 
                column-gap: 0 !important;
                padding: 15px 0px !important;
                display: block !important;
                width: 100% !important;
            }

            /* Imágenes adaptadas al ancho real */
            .galeria-proyecto img {
                width: 100% !important;
                max-width: 100% !important;
                height: auto !important;
                margin-bottom: 12px !important;
                display: block !important;
            }

            /* Ajuste del footer */
            footer {
                display: block !important;
                width: 100% !important;
                padding: 40px 15px 20px 15px !important;
                box-sizing: border-box !important;
            }
        
        }
    </style>
</head>

<body>

    <div class="header">
        <a href="index.html" class="btn-volver">[ Volver ]</a>
        <div class="titulo">
            PROYECTO PARQUE LAS HERAS | FREIRINA | MI PARQUE
        </div>
    </div>

    <div class="galeria-proyecto">
        <img src="images/FREIRINA/FREIRINA0 (2).jpg">
        <img src="images/FREIRINA/FREIRINA0 (3).jpg">
        <img src="images/FREIRINA/FREIRINA0 (5).jpg">
        <img src="images/FREIRINA/FREIRINA0 (4).jpg">
        <img src="images/FREIRINA/FREIRINA0 (1).jpg">
        <img src="images/FREIRINA/FREIRINA0 (6).jpg">
        <img src="images/FREIRINA/Freirina7.jpg">
    </div>

    <footer style="padding: 40px 25px 20px 25px;">
        <p style="font-size: 10px; color: #5e5d5d; text-transform: uppercase; letter-spacing: 2px; margin: 0;">
            LOICA ESTUDIO ® 2026 
        </p>
    </footer>

</body>
</html>
