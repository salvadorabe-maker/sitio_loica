<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Proyectos</title>

    <style>
        body {
            margin: 0;
            background-color: #FBF9EF;
            font-family: Helvetica, Arial, sans-serif;
        }

        /* HEADER */
        .header {
            padding: 25px;
            border-bottom: 1px solid #d8d8d8;
        }

        .titulo {
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #444;
        }

        /* GALERIA (ESCRITORIO) */
        .galeria-proyecto {
            column-count: 2;
            column-gap: 14px;
            padding: 25px;
        }

        .galeria-proyecto img {
            width: 100%;
            margin-bottom: 14px;
            display: block;
        }

        /* ==========================================
           RESPONSIVE MÓVIL (ESTÁNDAR LIMPIO)
           ========================================== */
        @media screen and (max-width: 768px) {
    html, body {
        overflow-x: hidden !important;
        overflow-y: auto !important;
        height: auto !important;
        width: 100% !important;
    }

    .header {
        padding: 20px 15px !important;
    }

    .titulo {
        font-size: 10px !important;
        letter-spacing: 2px !important;
        padding-right: 60px !important;
    }

    .btn-volver {
        position: fixed !important;
        top: auto !important;
        bottom: 20px !important;
        right: 15px !important;
        z-index: 3000 !important;
        background-color: #FBF9EF !important;
        padding: 6px 10px !important;
        border-radius: 3px !important;
        border: 1px solid #d8d8d8 !important;
    }

    .galeria-proyecto {
        column-count: 1 !important;
        padding: 15px 0px !important;
    }

    .galeria-proyecto img {
        width: 100% !important;
        max-width: 100% !important;
        height: auto !important;
        margin-bottom: 10px !important;
    }

    footer {
        padding: 30px 15px 20px 15px !important;
    }
}
    </style>
</head>

<body>

    <div class="header">
        <a href="index.html" class="btn-volver">[ Volver ]</a>
        <div class="titulo">
            PROYECTO PARQUE LAS HERAS | FREIRINA | ATACAMA | MI PARQUE | 2021
        </div>
    </div>

    <div class="galeria-proyecto">
        <img src="images/FREIRINA/FREIRINA0 (2).jpg">
        <img src="images/FREIRINA/FREIRINA0 (3).jpg">
        <img src="images/FREIRINA/FREIRINA0 (5).jpg">
        <img src="images/FREIRINA/FREIRINA0 (4).jpg">
        <img src="images/FREIRINA/FREIRINA0 (1).jpg">
        <img src="images/FREIRINA/FREIRINA0 (6).jpg">
        <img src="images/FREIRINA/Freirina7.jpg">
    </div>

    <footer style="padding: 40px 25px 20px 25px;">
        <p style="font-size: 10px; color: #5e5d5d; text-transform: uppercase; letter-spacing: 2px; margin: 0;">
            LOICA ESTUDIO ® 2026 
        </p>
    </footer>

</body>
</html>
