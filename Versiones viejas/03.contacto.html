<!DOCTYPE HTML>
<html>
<head>
    <title>Contacto - Loica Estudio</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #111;
        }

        /* Header simple */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 3rem;
        }

        .header h1 {
            font-size: 1rem;
            letter-spacing: 0.2rem;
            font-weight: 600;
        }

        .header a {
            text-decoration: none;
            color: #111;
            font-size: 0.8rem;
            border-bottom: 1px solid #111;
            padding-bottom: 2px;
        }

        /* Contenido */
        .contacto {
            max-width: 600px;
            margin: 6rem auto;
            padding: 0 2rem;
            font-size: 0.95rem;
            line-height: 1.8;
        }

        .contacto h2 {
            font-size: 1.2rem;
            letter-spacing: 0.15rem;
            margin-bottom: 2rem;
            font-weight: 500;
        }

        .contacto p {
            margin-bottom: 1.5rem;
        }

        .contacto a {
            color: #111;
            text-decoration: none;
            border-bottom: 1px solid #111;
            transition: 0.3s;
        }

        .contacto a:hover {
            opacity: 0.6;
        }

        /* Footer mínimo */
        .footer {
            text-align: center;
            padding: 4rem 2rem;
            font-size: 0.75rem;
            color: #777;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <div class="header">
        <h1>LOICA ESTUDIO</h1>
        <a href="index.html">← Volver</a>
    </div>

    <!-- Contacto -->
    <section class="contacto">

        </p>

    </section>

    <!-- Footer -->
    <div class="footer">
        © Loica Estudio
    </div>

</body>
</html>
