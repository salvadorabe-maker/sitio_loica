<html>
	<head>
		<title>ESTUDIO LOICA</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />

<style>

/* SACAR ZOOM */
.banner.style5 .image {
    overflow: hidden;
}

.banner.style5 .image img {
    transform: none !important;
    object-fit: cover !important;
    object-position: center center !important;
    position: absolute !important;
    width: 100% !important;
    height: 100% !important;
}

/* TITULO */

.banner .content h1 {
    color: rgb(255, 255, 255) !important;
    text-align: center;
    width: 100%;
    font-weight: 500;
    letter-spacing: 0.14em;

}

/* SUBTITULO */

.banner .content .major {
    color: rgb(255, 255, 255) !important;
    font-size: 1.125rem;
    text-align: center;
    font-weight: 450;

}
/* SLIDESHOW */

#slideshow img.slide {
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
    object-position: center center !important;
    opacity: 0 !important;
    transition: opacity 1s ease-in-out !important;
}

#slideshow img.slide.activa {
    opacity: 1 !important;
}


/* SACAR FILTRO BANNER */
.banner.style5::before {
    display: none !important;
}

/* POSICION CONTENIDO */
.banner.style5 {
    align-items: flex-end !important;
    padding-bottom: 0.25rem !important;
}

</style>

    

		<noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>




	</head>




	<body>

		<!-- Wrapper -->
			<div id="wrapper" class="divided">




				<!-- One -->


<section class="banner style5 fullscreen content-align-center image-position-center">
   <div class="content">

    <h1>LOICA ESTUDIO</h1>

    <p class="major">Diseño de jardines, espacios públicos e infraestructura verde</p>

    <div class="menu-container" style="margin-top: 0.5rem;">



    <button onclick="toggleMenu()" style="
        background: transparent;
        border: 1px solid #ffffff;
        border-radius: 4px;
        color: #ffffff !important;
        font-size: 0.7rem;
        font-weight: 600;
        padding: 0.6rem 1.5rem;
        cursor: pointer;
        letter-spacing: 0.1rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    ">MENÚ</button>

    <div id="menu-desplegable" style="
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.4s ease;
        margin-top: 0.5rem;
        background: rgba(0,0,0,0.6);
        border-radius: 4px;
        width: fit-content;
    ">
        <a href="03.contacto.html" style="display:block; padding: 0.2rem 0.8rem; color:#ffffff; text-decoration:none; font-size:0.9rem;">Contacto</a>
       <a href="02.proyectos.html" style="display:block; padding: 0.2rem 0.8rem; color:#ffffff; text-decoration:none; font-size:0.9rem;">Proyectos</a>
    </div>
</div>


</div>

<div class="image" id="slideshow">


    <img src="images/banner1.jpg" alt="" class="slide activa" />
    <img src="images/banner2.jpg" alt="" class="slide" />
    <img src="images/banner3.jpg" alt="" class="slide" />


</div>


</section>



		

			</div>

		<!-- Scripts -->


			<script src="assets/js/jquery.min.js"></script>
<script src="assets/js/jquery.scrollex.min.js"></script>
<script src="assets/js/jquery.scrolly.min.js"></script>
<script src="assets/js/browser.min.js"></script>
<script src="assets/js/breakpoints.min.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/main.js"></script>

<script>
  function toggleMenu() {
    var menu = document.getElementById('menu-desplegable');
    if (menu.style.maxHeight === '0px' || menu.style.maxHeight === '') {
      menu.style.maxHeight = '200px';
    } else {
      menu.style.maxHeight = '0';
    }
  }

setTimeout(function() {
    var slides = document.querySelectorAll('#slideshow .slide');
    console.log('slides encontradas:', slides.length);
    var actual = 0;
    setInterval(function() {
        slides[actual].classList.remove('activa');
        actual = (actual + 1) % slides.length;
        slides[actual].classList.add('activa');
    }, 4000);
}, 1000);
</script>


	</body>
</html>
