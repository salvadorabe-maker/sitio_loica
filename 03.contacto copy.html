<!DOCTYPE HTML>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Contacto - Loica Estudio</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* Bloqueado en PC */
            background-color: #FBF9EF;
            font-family: 'Helvetica', sans-serif;
        }

        /* BOTÓN VOLVER */
        .btn-volver {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 10px;
            font-weight: 700;
            text-decoration: none;
            color: #000000;
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 1000;
        }

        /* CONTENEDOR PRINCIPAL (PC) */
        .main-container {
            height: 100vh;
            width: 100vw;
            padding: 30px 25px;
            box-sizing: border-box;
            display: flex;
            gap: 1rem;
            align-items: flex-start;
        }

        /* COLUMNA IZQUIERDA (PC) */
        .info-column {
            width: 300px;
        }

        .logo-wrap {
            margin-bottom: 40px;
        }

        .logo-wrap img {
            height: 60px;
            width: auto;
            display: block;
        }

        .title-contact {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: #000;
            margin: 0 0 35px 0;
        }

        .data-block {
            font-size: 12px;
            line-height: 1.8;
            color: #000;
            letter-spacing: 1px;
        }

        .name-row {
            margin: 0;
            font-weight: 700;
            text-transform: uppercase;
        }

        .role-text {
            font-weight: 400;
            color: #666;
            margin-left: 5px;
        }

        .details-wrap {
            margin-top: 25px;
        }

        .details-wrap p {
            margin: 10px 0;
        }
        .details-wrap p:first-child { margin-top: 0; }
        .details-wrap p:last-child { margin-bottom: 0; }

        .label-style {
            font-weight: 700;
            text-transform: uppercase;
            font-size: 10px;
            margin-right: 10px;
        }

        .mail-style {
            color: #000;
            text-decoration: none;
            border-bottom: 1px solid #ff1702;
        }

        .links-wrap {
            margin-top: 40px;
        }

        .insta-style {
            color: #000;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: inline-block;
            margin-bottom: 10px;
        }

        .behance-style {
            color: #408fdf;
            text-decoration: none;
        }

        /* COLUMNA DERECHA (PC) */
        .photo-column {
            flex-shrink: 0;
            margin-top: 140px;
        }

        .photo-column img {
            width: 300px;
            aspect-ratio: 2/3;
            object-fit: cover;
            display: block;
        }

        /* FOOTER (PC) */
        .footer-fixed {
            position: fixed;
            bottom: 10px;
            left: 25px;
            width: 100%;
        }

        .footer-fixed p {
            font-size: 10px;
            color: #5e5d5d;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
        }

        /* ==========================================
           RESPONSIVE EXCLUSIVO PARA CELULARES 
           ========================================== */
        @media screen and (max-width: 768px) {
            html, body {
                overflow: auto !important; /* Libera scroll en móvil */
                height: auto !important;
            }

            .main-container {
                flex-direction: column !important;
                height: auto !important;
                width: 100% !important;
                padding: 60px 20px 120px 20px !important;
                gap: 40px !important;
            }

            .info-column {
                width: 100% !important;
            }

            .data-block p {
                text-align: justify !important;
                hyphens: auto !important;
            }

            .photo-column {
                margin-top: 20px !important;
                width: 100% !important;
                display: flex;
                justify-content: center;
            }

            .photo-column img {
                width: 100% !important;
                max-width: 300px !important;
                height: auto !important;
            }

            .footer-fixed {
                position: fixed !important;
                bottom: 0 !important;
                left: 0 !important;
                background-color: #FBF9EF !important;
                padding: 15px 20px !important;
                box-sizing: border-box !important;
                border-top: 1px solid #00000022 !important;
            }

            .footer-fixed p {
                font-size: 8px !important;
                text-align: center !important;
            }
        }
    </style>
</head>
<body>

    <!-- VOLVER -->
    <a href="index.html" class="btn-volver">[ Volver ]</a>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="main-container">

        <!-- COLUMNA IZQUIERDA: INFO -->
        <div class="info-column">

            <!-- LOGO -->
            <div class="logo-wrap">
                <a href="index version 2 .html">
                    <img src="images/LOICA.png" alt="Loica Estudio">
                </a>
            </div>

            <!-- TÍTULO -->
            <h2 class="title-contact">Contacto</h2>

            <!-- DATOS -->
            <div class="data-block">
                <p class="name-row">
                    Alfonso Abé Castro <span class="role-text">/ Arquitecto y Paisajista</span>
                </p>

                <div class="details-wrap">
                    <p>
                        <span class="label-style">Dirección:</span>Málaga 888, Santiago, Chile
                    </p>
                    <p>
                        <span class="label-style">Teléfono:</span>+56 9 99491816
                    </p>
                    <p>
                        <span class="label-style">Email:</span>
                        <a href="mailto:alfonsoabe88@gmail.com" class="mail-style">alfonsoabe88@gmail.com</a>
                    </p>
                </div>

                <div class="links-wrap">
                    <a href="https://instagram.com/loicaestudio" target="_blank" class="insta-style">
                        Instagram: @loicaestudio ↗
                    </a>
                    <br>
                    <a href="https://www.behance.net/alfonsoab" target="_blank" class="behance-style">
                        Behance Proyectos 
                    </a>
                </div>
            </div>

        </div>

        <!-- COLUMNA DERECHA: FOTO -->
        <div class="photo-column">
            <img src="images/FONCHO.jpg" alt="">
        </div>

    </div>

    <!-- FOOTER -->
    <footer class="footer-fixed">
        <p>Copyright 2026 LOICA ESTUDIO | Todos los derechos reservados.</p>
    </footer>

</body>
</html>
