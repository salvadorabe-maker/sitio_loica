<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Proyectos</title>

    <style>

        body {
            margin: 0;
            background-color: #FBF9EF;
            font-family: Helvetica, Arial, sans-serif;
        }

        /* HEADER */

        .header {
            padding: 25px;
            border-bottom: 1px solid #d8d8d8;
        }

        .titulo {
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #444;
        }

        /* GALERIA */

        .galeria-proyecto {
            column-count: 2;
            column-gap: 14px;
            padding: 25px;
        }

        .galeria-proyecto img {
            width: 100%;
            margin-bottom: 14px;
            display: block;
        }

       /* ==========================================
           RESPONSIVE MÓVIL (AJUSTE CURACAVÍ + FOOTER)
           ========================================== */
        @media screen and (max-width: 768px) {
            html, body {
                overflow-x: hidden !important;
                overflow-y: auto !important;
                height: auto !important;
                width: 100% !important;
            }

            /* Deja espacio a la derecha para que el título no choque con el botón fijo */
            .header {
                padding: 20px 90px 20px 15px !important; 
                box-sizing: border-box !important;
            }

            /* Botón volver flotando limpio */
            .btn-volver {
                position: fixed !important;
                top: 16px !important;
                right: 15px !important;
                z-index: 3000 !important;
                background-color: #FBF9EF !important;
                padding: 4px 6px !important;
                border-radius: 3px !important;
            }

            /* DESTRUCTOR DE COLUMNAS PARA LA GALERÍA */
            .galeria-proyecto, 
            [class*="galeria"], 
            [class*="photo-column"] {
                display: block !important;
                column-count: 1 !important;
                grid-template-columns: none !important;
                padding: 15px 0px !important;
                width: 100% !important;
            }

            /* FUERZA ANCHO TOTAL EN ELEMENTOS INTERNOS EXCLUSIVOS DE LA GALERÍA */
            .galeria-proyecto *, 
            [class*="galeria"] *, 
            [class*="photo-column"] * {
                display: block !important;
                width: 100% !important;
                max-width: 100% !important;
                min-width: 100% !important;
                height: auto !important;
                margin-left: 0 !important;
                margin-right: 0 !important;
                padding: 0 !important;
            }

            /* SEPARACIÓN VERTICAL LIMPIA ENTRE FOTOS */
            .galeria-proyecto img, 
            [class*="galeria"] img, 
            [class*="photo-column"] img {
                width: 100% !important;
                max-width: 100% !important;
                height: auto !important;
                margin-bottom: 12px !important;
                display: block !important;
            }

            /* PROTECCIÓN Y VISIBILIDAD DEL FOOTER */
            footer, .footer {
                display: block !important;
                clear: both !important; /* Rompe cualquier float previo */
                width: 100% !important;
                height: auto !important;
                position: relative !important;
                padding: 40px 15px 30px 15px !important; /* Le da el aire correcto abajo del todo */
                box-sizing: border-box !important;
                background-color: #FBF9EF !important;
            }

            footer *, .footer * {
                display: inline-block !important; /* Evita que los textos del footer se rompan en bloques raros */
                width: auto !important;
                max-width: 100% !important;
            }
        }/* ==========================================
           ARREGLO PARA CELULARES (BOTÓN VOLVER)
           ========================================== */
        @media screen and (max-width: 768px) {
            .btn-volver {
                position: fixed !important; /* Se queda fijo arriba para que no tape los textos al mover la pantalla */
                top: 0 !important;
                left: 0 !important;
                right: 0 !important;
                width: 100% !important;
                background-color: #FBF9EF !important; /* Tapamos con el color de fondo los textos que pasen por detrás */
                padding: 15px 20px !important;
                text-align: right !important; /* Mantiene el "Volver" a la derecha */
                box-sizing: border-box !important;
                z-index: 4000 !important; /* Máxima prioridad para que siempre esté arriba */
                border-bottom: 1px solid #00000011; /* Una línea muy sutil de separación */
            }

            /* Forzamos que el contenido del proyecto empiece más abajo en el celular */
            body {
                padding-top: 50px !important; 
            }
        }



        /* BOTÓN VOLVER */

.btn-volver {
    position: absolute;
    top: 20px;

    font-size: 10px;
    font-weight: 700;
    text-decoration: none;
    color: #000000;
    text-transform: uppercase;
    letter-spacing: 2px;
    z-index: 1000;
}

    </style>
</head>
