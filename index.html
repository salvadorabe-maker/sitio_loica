    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        height: 100%;
        width: 100%;
        overflow: hidden;
        background-color: #FBF9EF;
        font-family: 'Helvetica', 'Arial', sans-serif;
    }

    /* GRID DE FOTOS */
   .marco {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: grid;

    /* 5 fotos iguales por fila */
    grid-template-columns: repeat(5, 1fr);

    /* 4 filas iguales */
    grid-template-rows: repeat(4, 1fr);

    gap: 4px;

    z-index: 1;
    pointer-events: none;
}

    .foto-slot {
    overflow: hidden;
    opacity: 0;
    transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    background-color: #eae6d8;
}

.foto-slot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

    /* Slots vacíos del centro */
    .vacio {
        background: transparent !important;
        pointer-events: none;
    }

    /* CENTRO */
    .contenedor {
        position: relative;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 30px;
        z-index: 10;
    }

    .logo {
        height: 75px;
        width: auto;
        display: block;
        opacity: 0;
        animation: fadeIn 1.75s ease 0.1s forwards;
        align-self: flex-start;
        margin-left: -242px;
    }

    .palabras-wrap {
        position: relative;
        padding: 16px 24px;
    }

    .palabras-wrap svg {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        overflow: visible;
    }

    .palabras {
        display: flex;
        gap: 12px;
        align-items: center;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #555;
        position: relative;
        z-index: 1;
    }

    .sep {
        color: #ccc;
        opacity: 0;
        animation: fadeIn 1s ease 2.4s forwards;
        font-weight: 400;
    }

    .p1 {
        opacity: 0;
        transform: translateX(-300px);
        animation: desdeIzquierda 2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    }

    .p2 {
        opacity: 0;
        transform: translateY(-180px);
        animation: desdeArriba 2s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
    }

    .p3 {
        opacity: 0;
        transform: translateX(300px);
        animation: desdeDerecha 2s cubic-bezier(0.16, 1, 0.3, 1) 0.9s forwards;
    }

    .btn-entrar {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #000;
        text-decoration: none;
        border-bottom: 1px solid #000;
        padding-bottom: 3px;
        margin-top: 20px;
        opacity: 0;
        animation: fadeIn 1s ease 2.8s forwards;
    }

    .btn-entrar:hover { color: #666; border-color: #666; }

    @keyframes desdeIzquierda {
        0%   { opacity: 0; transform: translateX(-300px); }
        100% { opacity: 1; transform: translateX(0); }
    }
    @keyframes desdeArriba {
        0%   { opacity: 0; transform: translateY(-180px); }
        100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes desdeDerecha {
        0%   { opacity: 0; transform: translateX(300px); }
        100% { opacity: 1; transform: translateX(0); }
    }
    @keyframes fadeIn {
        0%   { opacity: 0; }
        100% { opacity: 1; }
    }

    @media screen and (max-width: 768px) {

    .marco {
        position: fixed;
        inset: 0;

        width: 100%;
        height: 100%;

        display: grid;

        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);

        grid-template-rows:
            minmax(0, 1fr)
            minmax(0, 1fr)
            minmax(150px, 1.25fr)
            minmax(0, 1fr)
            minmax(0, 1fr);

        gap: 5px;

        padding: 5px;
        box-sizing: border-box;

        overflow: hidden;
    }


    /* =========================
       FOTOS
       ========================= */

    .foto-slot {
    width: 100%;
    height: 100%;

    min-width: 0;
    min-height: 0;

    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;

    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
}

.foto-slot img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: contain;

    border: none !important;
    box-shadow: none !important;
}


    /* =========================
       2 × 2 ARRIBA
       ========================= */

    #s0 {
        grid-column: 1;
        grid-row: 1;
    }

    #s1 {
        grid-column: 2;
        grid-row: 1;
    }

    #s2 {
        grid-column: 1;
        grid-row: 2;
    }

    #s3 {
        grid-column: 2;
        grid-row: 2;
    }


    /* =========================
       CENTRO
       ========================= */

    .contenedor {
        grid-column: 1 / 3;
        grid-row: 3;

        width: 100%;
        height: 100%;

        min-width: 0;
        min-height: 0;

        display: flex;
        flex-direction: column;

        justify-content: center;
        align-items: center;

        gap: 16px;

        z-index: 10;
    }


    /* =========================
       2 × 2 ABAJO
       ========================= */

    #s4 {
        grid-column: 1;
        grid-row: 4;
    }

    #s5 {
        grid-column: 2;
        grid-row: 4;
    }

    #s6 {
        grid-column: 1;
        grid-row: 5;
    }

    #s7 {
        grid-column: 2;
        grid-row: 5;
    }


    /* =========================
       RESTO DE SLOTS
       ========================= */

    #s8,
    #s9,
    #s10,
    #s11,
    #s12,
    #s13 {
        display: none;
    }


    /* =========================
       LOGO
       ========================= */

    .logo {
        height: 55px;
        width: auto;
        max-width: 70vw;

        margin-left: 0;
        align-self: center;
    }


    /* =========================
       PALABRAS
       ========================= */

    .palabras-wrap {
        padding: 10px 12px;
    }

    .palabras {
        display: flex;

        gap: 6px;

        font-size: 8px;
        letter-spacing: 1.8px;

        white-space: nowrap;
    }


    /* =========================
       ENTRAR
       ========================= */

    .btn-entrar {
        font-size: 10px;
        letter-spacing: 2.8px;

        margin-top: 6px;
    }
}


/* =========================================
   PANTALLAS MÓVILES MUY PEQUEÑAS
   ========================================= */

@media screen and (max-width: 390px) and (max-height: 700px) {

    .marco {
        gap: 3px;
        padding: 3px;

        grid-template-rows:
            minmax(0, 1fr)
            minmax(0, 1fr)
            minmax(125px, 1.15fr)
            minmax(0, 1fr)
            minmax(0, 1fr);
    }

    .contenedor {
        gap: 10px;
    }

    .logo {
        height: 46px;
    }

    .palabras-wrap {
        padding: 7px 9px;
    }

    .palabras {
        font-size: 7px;
        letter-spacing: 1.4px;
        gap: 4px;
    }

    .btn-entrar {
        font-size: 9px;
        letter-spacing: 2.2px;
        margin-top: 3px;
    }
}
    </style>

<body>

    <!-- MARCO DE FOTOS: 5 columnas x 4 filas = 20 celdas, 14 fotos + 6 vacías en el centro -->
    <div class="marco">
       <!-- FILA 1: arriba completa (5 fotos) -->
<div class="foto-slot" id="s0"><img src="images/Z_Fotos_Entrada/Foto perimetro (1).webp" alt=""></div>
<div class="foto-slot" id="s1"><img src="images/Z_Fotos Entrada/Foto perimetro (2).webp" alt=""></div>
<div class="foto-slot" id="s2"><img src="images/Z_Fotos Entrada/Foto perimetro (3).webp" alt=""></div>
<div class="foto-slot" id="s3"><img src="images/Z_Fotos Entrada/Foto perimetro (4).webp" alt=""></div>
<div class="foto-slot" id="s4"><img src="images/Z_Fotos Entrada/Foto perimetro (5).webp" alt=""></div>
        <!-- FILA 2: lados + centro vacío -->
        <div class="foto-slot" id="s5"><img src="" alt=""></div>
        <div class="vacio foto-slot"></div>
        <div class="vacio foto-slot"></div>
        <div class="vacio foto-slot"></div>
        <div class="foto-slot" id="s6"><img src="" alt=""></div>

        <!-- FILA 3: lados + centro vacío -->
        <div class="foto-slot" id="s7"><img src="" alt=""></div>
        <div class="vacio foto-slot"></div>
        <div class="vacio foto-slot"></div>
        <div class="vacio foto-slot"></div>
        <div class="foto-slot" id="s8"><img src="" alt=""></div>

        <!-- FILA 4: abajo completa (5 fotos) -->
        <div class="foto-slot" id="s9"><img src="" alt=""></div>
        <div class="foto-slot" id="s10"><img src="" alt=""></div>
        <div class="foto-slot" id="s11"><img src="" alt=""></div>
        <div class="foto-slot" id="s12"><img src="" alt=""></div>
        <div class="foto-slot" id="s13"><img src="" alt=""></div>
    </div>

    <!-- CENTRO -->
    <div class="contenedor">
        <a href="index.html">
            <img src="images/LOICA.png" alt="Loica Estudio" class="logo">
        </a>

        <div class="palabras-wrap">
            <svg id="rect-svg">
                <circle id="punto-inicio" cx="1" cy="1" r="3" fill="#a02813" opacity="0"/>
                <rect id="rect-linea" x="1" y="1" rx="0" fill="none" stroke="#a02813" stroke-width="0.8"/>
            </svg>
            <div class="palabras">
                <span class="p1">Jardines</span>
                <span class="sep">|</span>
                <span class="p2">Paisajismo</span>
                <span class="sep">|</span>
                <span class="p3">Arquitectura Exterior</span>
            </div>
        </div>

        <a href="02.Proyectos.html" class="btn-entrar">ENTRAR →</a>
    </div>

    <footer>
        <p>LOICA ESTUDIO ® 2026</p>
        <p>Málaga 888, Las Condes, Santiago, Chile</p>
    </footer>

    <div id="contador" style="position: fixed; bottom: 40px; left: 25px; font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: #bbb; font-family: 'Helvetica', sans-serif; z-index: 30;"></div>

    <script>
        // CONTADOR
        var visitas = localStorage.getItem('visitas_loica') || 0;
        visitas = parseInt(visitas) + 1;
        localStorage.setItem('visitas_loica', visitas);
        document.getElementById('contador').innerText = 'Visitas: ' + visitas;

       // FOTOS ALEATORIAS
var fotos = [];
for (var i = 1; i <= 14; i++) {
    fotos.push('images/Z_Fotos_Entrada/Foto perimetro (' + i + ').webp');
}
        fotos.sort(function() { return Math.random() - 0.5; });

        var slots = ['s0','s1','s2','s3','s4','s5','s6','s7','s8','s9','s10','s11','s12','s13'];
        for (var j = 0; j < 14; j++) {
            document.querySelector('#' + slots[j] + ' img').src = fotos[j];
        }

        // Aparecer de a una
        for (var k = 0; k < 14; k++) {
            (function(index) {
                setTimeout(function() {
                    document.getElementById(slots[index]).style.opacity = '1';
                }, 500 + index * 250);
            })(k);
        }

        // RECTÁNGULO
        setTimeout(function() {
            var rect = document.getElementById('rect-linea');
            var svg = document.getElementById('rect-svg');
            var punto = document.getElementById('punto-inicio');
            var wrap = document.querySelector('.palabras-wrap');

            var w = wrap.offsetWidth;
            var h = wrap.offsetHeight;

            svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
            svg.setAttribute('width', w);
            svg.setAttribute('height', h);
            rect.setAttribute('width', w - 2);
            rect.setAttribute('height', h - 2);

            var perimetro = 2 * (w + h);
            rect.style.strokeDasharray = perimetro;
            rect.style.strokeDashoffset = perimetro;
            rect.style.stroke = '#d4998a';

            punto.style.opacity = '1';
            punto.style.transition = 'opacity 0.3s ease';

            setTimeout(function() {
                rect.style.transition = 'stroke-dashoffset 4.5s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.8s ease';
                rect.style.strokeDashoffset = '0';
                setTimeout(function() {
                    rect.style.stroke = '#a02813';
                    punto.style.opacity = '0';
                }, 4200);
            }, 500);

        }, 2000);
    </script>

</body>
