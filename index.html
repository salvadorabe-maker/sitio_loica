<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Estilos Base de la Grilla */
        .contenedor-grilla {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 columnas como el referente */
            gap: 15px; /* El aire blanco entre fotos */
            padding: 25px;
        }

        .item-proyecto {
            width: 100%;
            aspect-ratio: 3 / 2; /* Proporción de tus fotos */
            overflow: hidden;    /* Corta lo que sobresalga del marco */
            background-color: #f9f9f9; /* Color de fondo mientras carga */
        }

        .item-proyecto img {
            width: 100%;
            height: 100%;
            object-fit: cover;   /* Llena el marco sin deformarse */
            display: block;
        }

        /* Estilos Base Generales */
        body {
            margin: 0;
            padding: 0;
            background-color: #FBF9EF; /* Fondo crema */
            font-family: 'Helvetica', 'Arial', sans-serif; /* Tipografía limpia */
        }

        /* Encabezado Principal (Escritorio) */
        header {
            min-height: 152px;
            display: flex;
            justify-content: space-between;
            align-items: center;

            /* Poco espacio arriba, mucho espacio abajo */
            padding-top: 15px;      
            padding-bottom: 150px;   /* Gran colchón de aire blanco hacia los proyectos */
            padding-left: 25px;
            padding-right: 25px;

            background-color: #FBF9EF;
            border-bottom: 1px solid #FBF9EF; 
            
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* Logo / Nombre del Estudio */
        .logo {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px; 
            text-transform: uppercase; 
        }

        /* Menú de Navegación */
        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 15px; 
        }

        nav a {
            text-decoration: none;
            color: #666; 
            font-size: 16px;
        }

        nav a:hover {
            color: #000; 
        }

        /* Contenedor de Imágenes Adicionales */
        .galeria {
            display: flex;
            gap: 10px;
            padding: 20px;
        }

        .galeria img {
            width: 33.33%; 
            height: auto;
            filter: grayscale(20%); 
        }
/* ==========================================
           FOOTER PORTADA - BARRA DELGADA Y COMPACTA
           ========================================== */



        .footer-portada {
            display: flex !important;
            flex-direction: row !important;
            justify-content: space-between !important;
            align-items: center !important;
            clear: both !important;             
            width: 100% !important;
            position: relative !important;      
            z-index: 999 !important;            
            background-color: #FBF9EF !important; 
            
            /* BARRA DELGADA: Reducimos padding vertical */
            border-top: 1px solid #000000 !important; 
            padding: 10px 40px !important;            /* Achicado de 20px a 10px */
            box-sizing: border-box !important;
            margin-top: 30px !important;              /* Menos espacio entre proyectos y footer */
        }

        .footer-portada .footer-text {
            font-family: 'Helvetica', 'Arial', sans-serif !important;
            font-size: 10px !important;               /* Un punto más pequeña para que se vea más fina */
            font-weight: bold !important;             
            letter-spacing: 2px !important;           /* Ajustado para que quepa mejor */
            color: #000000 !important;                
            text-transform: uppercase !important;     
            margin: 0 !important;
            padding: 0 !important;
            display: inline-block !important;
        }
     

        /* =========================================
           RESPONSIVE CELULAR (OPTIMIZADO Y CENTRADO)
        ========================================= */
        @media screen and (max-width: 768px) {

            /* BLOQUEO ABSOLUTO DE SCROLL HORIZONTAL */
            html, body {
                overflow-x: hidden !important;
                overflow-y: auto !important;
                height: auto !important;
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            /* HEADER EN CELULAR */
            header {
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important; /* Centra todo en el eje horizontal móvil */
                justify-content: center !important;
                padding: 20px 15px !important;
                min-height: auto !important;
                width: 100% !important;
                max-width: 100% !important;
                box-sizing: border-box !important;
                margin: 0 auto !important;
            }

            /* BLOQUE LOGO + TEXTO */
            header > div:first-child {
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;    
                justify-content: center !important;
                width: 100% !important;
                max-width: 100% !important;
                gap: 15px !important;
                box-sizing: border-box !important;
                margin: 0 auto !important;
                padding: 0 !important;
            }

            /* LOGO MÓVIL */
            header img {
                height: 65px !important;
                width: auto !important;
                display: block !important;
                margin: 0 auto !important;
            }

            /* TEXTO DESCRIPTIVO MÓVIL */
            header p {
                width: 100% !important;
                max-width: 95% !important; /* Margen de seguridad para que 'Exterior' no baje solo */
                font-size: 11px !important;
                line-height: 1.6 !important;
                text-align: center !important;     
                box-sizing: border-box !important;
                margin: 5px auto 0 auto !important;
                padding: 0 !important;
            }

            /* MENÚ MÓVIL */
            nav {
                margin-top: 25px !important;
                width: 100% !important;
                text-align: center !important;
                box-sizing: border-box !important;
            }

            /* OCULTAR VISOR EN CELULAR */
            #visor-proyectos {
                display: none !important;
            }

            /* GRILLA VERTICAL (FOTOS PORTADA EN CELULAR) */
            .contenedor-grilla {
                display: flex !important;
                flex-direction: column !important;
                padding: 15px 0px !important; /* Fotos de borde a borde */
                gap: 12px !important;
                width: 100% !important;
                max-width: 100% !important;
                box-sizing: border-box !important;
                height: auto !important;
            }

            /* IMÁGENES RESPONSIVE */
            .item-proyecto,
            .item-proyecto a {
                display: block !important;
                width: 100% !important;
                max-width: 100% !important;
                height: auto !important;
                box-sizing: border-box !important;
            }

            .item-proyecto img {
                width: 100% !important;
                max-width: 100% !important;
                height: auto !important;
                aspect-ratio: auto !important;
                display: block !important;
                object-fit: contain !important;
            }

            /* AJUSTE BARRA DE FOOTER EN CELULAR */
            .footer-portada {
                margin-top: 30px !important;
                padding: 30px 15px 40px 15px !important; 
            }
            .footer-portada p {
                font-size: 10px !important;
            }
        }
    </style>
</head>
