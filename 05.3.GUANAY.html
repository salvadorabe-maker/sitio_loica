<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Proyectos</title>

    <style>

        body {
            margin: 0;
            background-color: #FBF9EF;
            font-family: Helvetica, Arial, sans-serif;
        }

        /* HEADER */

        .header {
            padding: 25px;
            border-bottom: 1px solid #d8d8d8;
        }

        .titulo {
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #444;
        }

        /* GALERIA */

        .galeria-proyecto {
            column-count: 2;
            column-gap: 14px;
            padding: 25px;
        }

        .galeria-proyecto img {
            width: 100%;
            margin-bottom: 14px;
            display: block;
        }

       /* ==========================================
           RESPONSIVE MÓVIL (UNA COLUMNA A ANCHO TOTAL)
           ========================================== */
        @media screen and (max-width: 768px) {
            html, body {
                overflow-x: hidden !important;
                overflow-y: auto !important;
                height: auto !important;
                width: 100% !important;
            }

            .header {
                padding: 20px 15px !important;
            }

            /* RESTRECCIÓN DEL BOTÓN VOLVER: FIJO AL HACER SCROLL */
            .btn-volver {
                position: fixed !important; /* Cambiado a fixed para bloquearlo en pantalla */
                top: 20px !important;
                right: 15px !important;
                z-index: 3000 !important; /* Se asegura de flotar por encima de todas las imágenes */
                background-color: #FBF9EF !important; /* Opcional: le da un fondo sólido si tapa las fotos */
                padding: 4px 8px !important;
                border-radius: 3px !important;
            }

            .galeria-proyecto {
                column-count: 1 !important;
                padding: 15px 0px !important;
            }

            .galeria-proyecto img {
                width: 100% !important;
                max-width: 100% !important;
                height: auto !important;
                margin-bottom: 10px !important;
            }

            footer {
                padding: 30px 15px 20px 15px !important;
            }
        }

        /* BOTÓN VOLVER */

.btn-volver {
    position: absolute;
    top: 20px;
    right: 25px;
    font-size: 10px;
    font-weight: 700;
    text-decoration: none;
    color: #000000;
    text-transform: uppercase;
    letter-spacing: 2px;
    z-index: 1000;
}

    </style>
</head>

<body>

  <div class="header">

   
        <a href="index.html" class="btn-volver">[ Volver ]</a>
